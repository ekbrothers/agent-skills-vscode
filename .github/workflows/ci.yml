name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (VS Code test instance)
        run: xvfb-run -a npm test

      - name: Apply organization settings
        env:
          PROMPT_LIBRARY_REPO: ${{ vars.PROMPT_LIBRARY_REPO }}
          PROMPT_LIBRARY_GITHUB_URL: ${{ vars.PROMPT_LIBRARY_GITHUB_URL }}
          PROMPT_LIBRARY_PUBLISHER: ${{ vars.PROMPT_LIBRARY_PUBLISHER }}
        run: npm run configure

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
