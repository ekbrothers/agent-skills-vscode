name: Release extension

# Push a tag that matches package.json, for example:
#   npm version patch   (bumps package.json and creates tag v0.0.2)
#   git push --follow-tags
# The workflow tests, packages the .vsix and attaches it to a GitHub Release.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}." >&2
            exit 1
          fi

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (VS Code test instance)
        run: xvfb-run -a npm test

      - name: Package
        run: npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --title "Prompt Library $GITHUB_REF_NAME" \
            --generate-notes

      # Private Marketplace publishing goes here once the admin confirms the
      # process (file share or Azure Artifacts feed). Until then, an admin
      # uploads the .vsix from the release by hand.
